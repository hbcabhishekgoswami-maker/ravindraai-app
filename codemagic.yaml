workflows:
  ravindraai-android:
    name: RavindraAI Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20.11.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
